<style>
  :root {
    /* 亮色主题变量 */
    --bg-primary: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
    --bg-secondary: rgba(255, 255, 255, 0.9);
    --bg-tertiary: rgba(248, 250, 252, 0.95);
    --bg-quaternary: rgba(241, 245, 249, 0.9);
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-tertiary: #475569;
    --border-primary: rgba(15, 23, 42, 0.2);
    --border-secondary: rgba(15, 23, 42, 0.1);
    --accent-primary: #3b82f6;
    --accent-secondary: #8b5cf6;
    --glass-bg: rgba(255, 255, 255, 0.3);
    --glass-border: rgba(15, 23, 42, 0.2);
    --shadow-color: rgba(0, 0, 0, 0.1);
    --info-item-bg: rgba(255, 255, 255, 0.7);
    --json-bg: rgba(248, 250, 252, 0.8);
    --api-item-bg: rgba(255, 255, 255, 0.7);
    --circle-bg: linear-gradient(45deg, rgba(59, 130, 246, 0.08), rgba(147, 51, 234, 0.08));
    --grid-color: rgba(15, 23, 42, 0.08);
    --ip-display-bg: rgba(255, 255, 255, 0.4);
    --ip-display-border: rgba(15, 23, 42, 0.3);
    --copy-btn-bg: linear-gradient(135deg, #3b82f6, #1d4ed8);
    --copy-btn-hover: linear-gradient(135deg, #1d4ed8, #1e40af);
  }

  /* 暗色主题变量 */
  [data-theme="dark"] {
    --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    --bg-secondary: rgba(15, 23, 42, 0.8);
    --bg-tertiary: rgba(30, 41, 59, 0.8);
    --bg-quaternary: rgba(30, 41, 59, 0.6);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --border-primary: rgba(59, 130, 246, 0.2);
    --border-secondary: rgba(59, 130, 246, 0.1);
    --accent-primary: #3b82f6;
    --accent-secondary: #8b5cf6;
    --glass-bg: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
    --shadow-color: rgba(0, 0, 0, 0.3);
    --info-item-bg: rgba(30, 41, 59, 0.6);
    --json-bg: rgba(0, 0, 0, 0.4);
    --api-item-bg: rgba(30, 41, 59, 0.6);
    --circle-bg: linear-gradient(45deg, rgba(59, 130, 246, 0.1), rgba(147, 51, 234, 0.1));
    --grid-color: rgba(59, 130, 246, 0.03);
    --ip-display-bg: rgba(255, 255, 255, 0.2);
    --ip-display-border: rgba(255, 255, 255, 0.3);
    --copy-btn-bg: linear-gradient(135deg, #10b981, #059669);
    --copy-btn-hover: linear-gradient(135deg, #059669, #047857);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    min-height: 100vh;
    color: var(--text-primary);
    line-height: 1.6;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* 背景装饰 */
  .background-decoration {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }

  .bg-circle {
    position: absolute;
    border-radius: 50%;
    background: var(--circle-bg);
    animation: float 8s ease-in-out infinite;
    filter: blur(1px);
  }

  .bg-circle-1 {
    width: 300px;
    height: 300px;
    top: -10%;
    left: -5%;
    animation-delay: 0s;
  }

  .bg-circle-2 {
    width: 200px;
    height: 200px;
    top: 50%;
    right: -5%;
    animation-delay: 3s;
  }

  .bg-circle-3 {
    width: 150px;
    height: 150px;
    bottom: -5%;
    left: 30%;
    animation-delay: 6s;
  }

  @keyframes float {

    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    50% {
      transform: translateY(-30px) rotate(180deg);
    }
  }

  /* 添加网格背景效果 */
  .main-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
    z-index: -1;
  }

  /* 主容器 */
  .main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 2rem 0rem 2rem;
    position: relative;
    z-index: 1;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 2rem;
    color: var(--text-primary);
  }

  .main-title {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 1rem;
    text-shadow: 0 2px 4px var(--shadow-color);
    color: var(--text-primary);
  }

  .ip-display {
    margin: 1.5rem 0;
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  .ip-value {
    display: inline-block;
    font-size: 1.8rem;
    font-weight: 600;
    background: var(--ip-display-bg);
    backdrop-filter: blur(10px);
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    border: 1px solid var(--ip-display-border);
    font-family: 'Monaco', 'Menlo', monospace;
    letter-spacing: 1px;
    max-width: 90vw;
    word-break: break-all;
    text-align: center;
    overflow-wrap: break-word;
    hyphens: auto;
    transition: all 0.3s ease;
    color: var(--text-primary);
  }

  /* IPv6 地址特殊处理 */
  .ip-value.ipv6 {
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  /* 顶部查询区域 */
  .top-query-section {
    margin-top: 1.5rem;
    max-width: 480px;
    width: 88%;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .search-container {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    overflow: hidden;
    transition: all 0.3s ease;
    flex: 1;
  }

  .search-container:hover {
    background: var(--glass-bg);
    border-color: var(--accent-primary);
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
  }

  .search-input {
    flex: 1;
    padding: 0.7rem 1.2rem;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    /* 修复移动端光标偏移问题 */
    line-height: 1.4;
    height: auto;
    min-height: 1.4em;
    vertical-align: middle;
    /* 防止iOS Safari的样式重置 */
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    /* 确保文本对齐 */
    text-align: left;
    /* 防止字体大小缩放 */
    -webkit-text-size-adjust: 100%;
    /* 修复Android Chrome的问题 */
    transform: translateZ(0);
  }

  .search-input::placeholder {
    color: var(--text-tertiary);
    /* 确保占位符对齐 */
    line-height: 1.4;
  }

  .search-btn {
    padding: 0.6rem;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: none;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0.2rem;
    width: 42px;
    height: 42px;
  }

  .search-btn:hover {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }

  /* 主题切换按钮 */
  .theme-toggle-btn {
    padding: 0.6rem;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    position: relative;
    overflow: hidden;
  }

  .theme-toggle-btn:hover {
    background: var(--accent-primary);
    color: white;
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }

  .theme-icon {
    transition: all 0.3s ease;
    position: absolute;
  }

  .sun-icon {
    opacity: 1;
    transform: rotate(0deg);
  }

  .moon-icon {
    opacity: 0;
    transform: rotate(180deg);
  }

  [data-theme="dark"] .sun-icon {
    opacity: 0;
    transform: rotate(180deg);
  }

  [data-theme="dark"] .moon-icon {
    opacity: 1;
    transform: rotate(0deg);
  }

  /* 暗色主题下的标题颜色 */
  [data-theme="dark"] .header {
    color: white;
  }

  [data-theme="dark"] .main-title {
    color: white;
  }

  /* 内容区域 */
  .content-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 3rem;
    align-items: start;
  }

  /* 面板通用样式 */
  .info-panel,
  .json-panel {
    background: var(--bg-secondary);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 8px 32px var(--shadow-color);
    border: 1px solid var(--border-primary);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  /* 信息面板独立高度 */
  .info-panel {
    height: fit-content;
  }

  /* JSON 面板保持最小高度 */
  .json-panel {
    min-height: 400px;
  }

  .info-panel::before,
  .json-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.8), transparent);
    animation: scan 3s infinite;
  }

  @keyframes scan {
    0% {
      left: -100%;
    }

    100% {
      left: 100%;
    }
  }

  .info-panel:hover,
  .json-panel:hover {
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2);
    transform: translateY(-2px);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(59, 130, 246, 0.2);
  }

  .panel-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .panel-header h2::before {
    content: '';
    width: 4px;
    height: 20px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
  }

  /* 信息网格 */
  .info-grid {
    display: grid;
    gap: 0.5rem;
  }

  .info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: var(--info-item-bg);
    border-radius: 10px;
    border: 1px solid var(--border-secondary);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .info-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  }

  .info-item:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-primary);
    transform: translateX(2px);
  }

  .info-label {
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .info-value {
    font-weight: 600;
    color: var(--text-primary);
    font-family: 'Monaco', 'Menlo', monospace;
    font-size: 0.8rem;
    background: rgba(59, 130, 246, 0.1);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    border: 1px solid var(--border-primary);
  }

  /* 位置和捐助区域 */
  .location-section {
    margin-top: 1.25rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(59, 130, 246, 0.2);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* 按钮行布局 */
  .button-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    width: 100%;
  }

  .map-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    flex: 1;
    justify-content: center;
    border: 1px solid rgba(59, 130, 246, 0.3);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }

  .map-btn:hover {
    background: linear-gradient(135deg, #0891b2, #2563eb);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  .map-feature-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 0.65rem;
    font-weight: 600;
    margin-left: 4px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .sponsor-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
  }

  .sponsor-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.3s ease;
    border: 1px solid rgba(245, 158, 11, 0.3);
    flex: 1;
    justify-content: center;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }

  .sponsor-btn:hover {
    background: linear-gradient(135deg, #d97706, #dc2626);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }

  .sponsor-text {
    font-size: 0.7rem;
    color: #94a3b8;
    text-align: center;
  }

  .sponsor-text a {
    color: #3b82f6;
    text-decoration: none;
  }

  .sponsor-text a:hover {
    text-decoration: underline;
    color: #60a5fa;
  }

  /* 大屏幕到中等屏幕 - 保持同一行，逐步缩小 */
  @media (max-width: 768px) and (min-width: 401px) {
    .button-row {
      gap: 0.5rem;
    }

    .map-btn,
    .sponsor-btn {
      font-size: 0.75rem;
      padding: 0.55rem 0.8rem;
      gap: 0.4rem;
    }

    .map-feature-badge {
      font-size: 0.6rem;
      padding: 1px 4px;
      margin-left: 2px;
    }
  }

  /* 中小屏幕 - 进一步缩小但保持同一行 */
  @media (max-width: 600px) and (min-width: 401px) {
    .button-row {
      gap: 0.4rem;
    }

    .map-btn,
    .sponsor-btn {
      font-size: 0.7rem;
      padding: 0.5rem 0.6rem;
      gap: 0.3rem;
    }

    .map-feature-badge {
      font-size: 0.55rem;
      padding: 1px 3px;
      margin-left: 1px;
    }
  }

  /* 小屏幕 - 最后尝试保持同一行 */
  @media (max-width: 500px) and (min-width: 401px) {
    .button-row {
      gap: 0.3rem;
    }

    .map-btn,
    .sponsor-btn {
      font-size: 0.65rem;
      padding: 0.45rem 0.5rem;
      gap: 0.25rem;
    }

    .map-feature-badge {
      font-size: 0.5rem;
      padding: 1px 2px;
      margin-left: 0px;
    }
  }

  /* 超小屏幕 - 分为两行 */
  @media (max-width: 400px) {
    .button-row {
      flex-direction: column;
      gap: 0.5rem;
    }

    .map-btn,
    .sponsor-btn {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.6rem 1rem;
      gap: 0.5rem;
    }

    .map-feature-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      margin-left: 4px;
    }
  }

  /* JSON 面板 */
  .copy-btn {
    padding: 0.6rem;
    background: var(--copy-btn-bg);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid var(--accent-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
    position: relative;
    overflow: hidden;
  }

  .copy-btn:hover {
    background: var(--copy-btn-hover);
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
  }

  .copy-btn:active {
    transform: translateY(0) scale(0.95);
  }

  .copy-btn svg {
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  .json-container {
    background: var(--json-bg);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    overflow-x: auto;
    border: 1px solid var(--border-primary);
  }

  .json-content {
    color: var(--text-primary);
    font-family: 'Monaco', 'Menlo', monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* JSON 语法高亮 */
  .json-key {
    color: #60a5fa;
  }

  .json-string {
    color: #34d399;
  }

  .json-number {
    color: #fbbf24;
  }

  .json-boolean {
    color: #f87171;
  }

  .json-null {
    color: #9ca3af;
  }

  .json-punctuation {
    color: #e2e8f0;
  }

  /* API 使用说明 */
  .api-section {
    padding-top: 1.25rem;
    border-top: 1px solid rgba(59, 130, 246, 0.2);
  }

  .api-section h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .api-section h3::before {
    content: '';
    width: 4px;
    height: 16px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
  }

  .api-examples {
    display: grid;
    gap: 0.5rem;
  }

  .api-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.75rem;
    background: var(--api-item-bg);
    border-radius: 8px;
    border: 1px solid var(--border-secondary);
    transition: all 0.3s ease;
  }

  .api-item:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-primary);
  }

  .api-label {
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .api-code {
    background: var(--json-bg);
    color: var(--text-primary);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-family: 'Monaco', 'Menlo', monospace;
    font-size: 0.75rem;
    word-break: break-all;
    border: 1px solid var(--border-primary);
    white-space: pre-line;
    line-height: 1.5;
    display: block;
    overflow-x: auto;
  }

  /* 地图模态框 */
  .map-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    backdrop-filter: blur(5px);
  }

  .map-modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .map-container {
    background: rgba(15, 23, 42, 0.95);
    border-radius: 12px;
    width: 90%;
    max-width: 800px;
    max-height: 80vh;
    height: auto;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
    border: none !important;
    position: relative;
  }

  .map-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: none;
    background: #f8fafc;
  }

  .map-header h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #2d3748;
    margin: 0;
  }

  .close-btn {
    background: none;
    border: none !important;
