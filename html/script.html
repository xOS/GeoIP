<script lang="text/javascript">
  let host = "{{ .Host }}";
  let jsonObj = "{{ .JSON }}";
  let data;

  // 安全地解析 JSON
  try {
    data = JSON.parse(jsonObj);
  } catch (e) {
    console.error('JSON解析失败:', e);
    data = {}; // 设置为空对象作为默认值
  }

  let ip = '';
  let ipQuery = '';

  window.onload = (event) => {
    // 确保 window.data 被正确初始化
    window.data = data;

    // 初始化主题
    initTheme();
    // 格式化 JSON 显示
    formatJSON();
    // 检查并优化 IP 显示
    optimizeIPDisplay();
    // 高亮 API 代码
    highlightApiCode();
    // 隐藏空白字段
    hideEmptyFields();
    // 优化窄屏幕显示
    optimizeNarrowScreen();
  }

  // 隐藏空白字段
  function hideEmptyFields() {
    // 获取所有信息项
    const infoItems = document.querySelectorAll('.info-item');

    // 遍历所有信息项，检查值是否为空
    infoItems.forEach(item => {
      const labelElement = item.querySelector('.info-label');
      const valueElement = item.querySelector('.info-value');

      // 特殊处理设备 UA 字段
      if (item.style.flexDirection === 'column' || item.style.flexDirection === 'column-reverse') {
        // 对于设备 UA 字段，检查值是否为空
        if (!valueElement || !valueElement.textContent.trim()) {
          item.style.display = 'none';
        }
        return;
      }

      if (labelElement && valueElement) {
        const labelText = labelElement.textContent.trim();
        const valueText = valueElement.textContent.trim();

        // 如果值为空，则隐藏整个信息项
        if (!valueText) {
          item.style.display = 'none';
        }
      }
    });
  }

  // 主题管理
  function initTheme() {
    // 默认使用亮色主题
    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    setTheme(newTheme);
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    // 更新主题切换按钮的提示文本
    const themeBtn = document.querySelector('.theme-toggle-btn');
    if (themeBtn) {
      themeBtn.title = theme === 'light' ? '切换到暗色模式' : '切换到亮色模式';
    }
  }

  function optimizeIPDisplay() {
    const ipValueElement = document.querySelector('.ip-value');
    if (ipValueElement) {
      const ipText = ipValueElement.textContent;

      // 检测 IPv6 地址
      if (ipText.includes(':') && ipText.length > 15) {
        ipValueElement.classList.add('ipv6');
      }

      // 检测超长 IP 地址
      if (ipText.length > 20) {
        ipValueElement.style.fontSize = '1.2rem';
        ipValueElement.style.letterSpacing = '0.2px';
      }
    }
  }

  // 优化窄屏幕显示
  function optimizeNarrowScreen() {
    const ipInput = document.getElementById('ipInput');
    if (ipInput) {
      // 根据屏幕宽度调整占位符文本
      function updatePlaceholder() {
        const screenWidth = window.innerWidth;
        if (screenWidth <= 280) {
          ipInput.placeholder = '输入IP';
        } else if (screenWidth <= 355) {
          ipInput.placeholder = '输入IP地址';
        } else {
          ipInput.placeholder = '输入 IP 地址查询其他位置';
        }
      }

      // 初始调用
      updatePlaceholder();

      // 监听窗口大小变化
      window.addEventListener('resize', updatePlaceholder);
    }
  }

  function formatJSON() {
    const jsonOutput = document.getElementById('jsonOutput');
    if (jsonOutput) {
      try {
        const formatted = JSON.stringify(JSON.parse(jsonObj), null, 2);
        const highlighted = syntaxHighlight(formatted);
        jsonOutput.innerHTML = highlighted;
      } catch (e) {
        jsonOutput.textContent = jsonObj;
      }
    }
  }

  function syntaxHighlight(json) {
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
      var cls = 'json-number';
      if (/^"/.test(match)) {
        if (/:$/.test(match)) {
          cls = 'json-key';
        } else {
          cls = 'json-string';
        }
      } else if (/true|false/.test(match)) {
        cls = 'json-boolean';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }

  // 暂时禁用API代码高亮，直接在HTML中处理
  function highlightApiCode() {
    // 不做任何处理，保持原始HTML内容
  }

  function copyJSON() {
    // 获取原始 JSON 内容，不包含 HTML 标签
    const jsonContent = JSON.stringify(JSON.parse(jsonObj), null, 2);

    if (navigator.clipboard) {
      navigator.clipboard.writeText(jsonContent).then(() => {
        showCopySuccess();
      }).catch(() => {
        fallbackCopy(jsonContent);
      });
    } else {
      fallbackCopy(jsonContent);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
      document.execCommand('copy');
      showCopySuccess();
    } catch (err) {
      console.error('复制失败:', err);
    }

    document.body.removeChild(textArea);
  }

  function showCopySuccess() {
    const copyBtn = document.querySelector('.copy-btn');
    const originalHTML = copyBtn.innerHTML;

    // 创建成功提示图标
    const successIcon = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20,6 9,17 4,12"/>
      </svg>
    `;

    copyBtn.innerHTML = successIcon;
    copyBtn.style.background = '#4caf50';
    copyBtn.title = '已复制!';

    setTimeout(() => {
      copyBtn.innerHTML = originalHTML;
      copyBtn.style.background = '';
      copyBtn.title = '复制 JSON';
    }, 2000);
  }

  function navigate() {
    const ipInput = document.getElementById('ipInput');
    const inputValue = ipInput.value.trim();

    if (inputValue) {
      // 简单的 IP 地址验证
      const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
      const ipv6Regex = /^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/;

      if (ipRegex.test(inputValue) || ipv6Regex.test(inputValue)) {
        // 使用 AJAX 请求获取数据，而不是跳转页面
        fetch(`/json?ip=${encodeURIComponent(inputValue)}`)
          .then(response => response.json())
          .then(data => {
            // 更新页面内容
            updatePageContent(data);
          })
          .catch(error => {
            console.error('Error fetching data:', error);
            alert('查询失败，请稍后重试');
          });
      } else {
        alert('请输入有效的 IP 地址');
        ipInput.focus();
      }
    } else {
      alert('请输入 IP 地址');
      ipInput.focus();
    }
  }

  function updateIP(value) {
    ip = value.trim();
  }

  function updatePageContent(data) {
    // 更新地图数据（首先更新，确保在函数执行过程中使用最新的数据）
    window.data = data;

    // 同时更新全局 jsonObj 变量
    jsonObj = JSON.stringify(data);

    // 更新页面标题中的IP显示
    const ipValueElements = document.querySelectorAll('.ip-value');
    ipValueElements.forEach(element => {
      element.textContent = data.ip || 'N/A';
      // 优化IP显示
      if (data.ip && data.ip.includes(':') && data.ip.length > 15) {
        element.classList.add('ipv6');
      } else {
        element.classList.remove('ipv6');
      }

      // 检测超长 IP 地址
      if (data.ip && data.ip.length > 20) {
        element.style.fontSize = '1.2rem';
        element.style.letterSpacing = '0.2px';
      } else {
        element.style.fontSize = '';
        element.style.letterSpacing = '';
      }
    });

    // 通过标签文本来更新左侧信息框中的各项信息
    // 只有在元素存在时才更新，避免因为元素不存在而出现问题
    safeUpdateInfoItemByLabel('IP 地址', data.ip);
    safeUpdateInfoItemByLabel('国家/地区', data.country);
    safeUpdateInfoItemByLabel('国家代码', data.country_code);
    safeUpdateInfoItemByLabel('省/州', data.region);
    safeUpdateInfoItemByLabel('城市', data.city);
    safeUpdateInfoItemByLabel('区县', data.district);
    safeUpdateInfoItemByLabel('邮编', data.zip_code);
    // 安全地更新经纬度信息
    if (data.latitude !== undefined && data.longitude !== undefined) {
      safeUpdateInfoItemByLabel('经纬度', data.latitude + ',' + data.longitude);
    } else {
      safeUpdateInfoItemByLabel('经纬度', '');
    }
    safeUpdateInfoItemByLabel('时区', data.time_zone);
    safeUpdateInfoItemByLabel('ASN', data.asn);
    safeUpdateInfoItemByLabel('服务商', data.isp);
    safeUpdateInfoItemByLabel('所属组织', data.org);
    safeUpdateInfoItemByLabel('网络类型', data.connection_type);
    safeUpdateInfoItemByLabel('主机名', data.hostname);

    // 设备 UA (特殊处理)
    const userAgentItems = document.querySelectorAll('.info-item[style*="flex-direction:column"]');
    if (userAgentItems.length > 0) {
      const userAgentElement = userAgentItems[0].querySelector('.info-value');
      if (userAgentElement) {
        const parent = userAgentItems[0];
        if (data.user_agent) {
          userAgentElement.textContent = data.user_agent;
          userAgentElement.style.whiteSpace = 'pre-line';
          userAgentElement.style.wordBreak = 'break-all';
          userAgentElement.style.marginTop = '2px';
          parent.style.display = '';
        } else {
          parent.style.display = 'none';
        }
      }
    }

    // 更新JSON预览框
    const jsonOutput = document.getElementById('jsonOutput');
    if (jsonOutput) {
      try {
        const formatted = JSON.stringify(data, null, 2);
        const highlighted = syntaxHighlight(formatted);
        jsonOutput.innerHTML = highlighted;
        // 更新全局变量
        jsonObj = JSON.stringify(data);
      } catch (e) {
        jsonOutput.textContent = JSON.stringify(data);
      }
    }

    // 控制地图按钮的显示/隐藏
    const mapBtn = document.querySelector('.map-btn');
    if (mapBtn) {
      // 使用更宽松的检查
      if (data.latitude !== undefined && data.latitude !== null && data.longitude !== undefined && data.longitude !== null) {
        mapBtn.style.display = '';
      } else {
        mapBtn.style.display = 'none';
      }
    }
  }

  function safeUpdateInfoItemByLabel(label, value) {
    // 查找对应标签的元素
    const labelElements = Array.from(document.querySelectorAll('.info-label'));
    const labelElement = labelElements.find(el => el.textContent.trim() === label);

    if (labelElement) {
      // 找到对应的值元素（在标签元素的父元素中的另一个子元素）
      const parent = labelElement.closest('.info-item');
      if (parent) {
        const valueElement = parent.querySelector('.info-value');
        if (valueElement) {
          // 如果有值则显示，否则隐藏整个信息项
          if (value !== undefined && value !== null && value !== "") {
            valueElement.textContent = value;
            parent.style.display = '';
          } else {
            parent.style.display = 'none';
          }
        }
      }
    }
    // 如果没有找到对应的标签元素，则不执行任何操作
  }

  // 全局标志和缓存
  let isCreatingMap = false;
  let mapLibraryLoaded = false;
  let mapLibraryLoading = false;

  // 预加载地图库（优化版）
  function preloadMapLibrary() {
    if (!window.maplibregl && !mapLibraryLoading && !mapLibraryLoaded) {
      mapLibraryLoading = true;
      const script = document.createElement('script');
      script.src = 'https://s4.zstatic.net/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.min.js';
      script.async = true; // 异步加载
      script.defer = true; // 延迟执行
      script.onload = () => {
        mapLibraryLoaded = true;
        mapLibraryLoading = false;
        console.log('MapLibre GL JS 预加载完成');
      };
      script.onerror = () => {
        mapLibraryLoading = false;
        console.error('MapLibre GL JS 预加载失败');
      };
      document.head.appendChild(script);
    }
  }

  // 立即开始预加载地图库
  if ('requestIdleCallback' in window) {
    requestIdleCallback(() => {
      preloadMapLibrary();
    }, { timeout: 1000 }); // 进一步减少超时时间
  } else {
    // 备用方案：立即加载
    setTimeout(preloadMapLibrary, 500);
  }

  // 显示地图（优化版）
  function showMap() {
    console.log('showMap called', window.data ? window.data.latitude : 'undefined', window.data ? window.data.longitude : 'undefined', isCreatingMap);

    // 检查 window.data 是否存在
    if (!window.data) {
      console.error('window.data is undefined');
      alert('地图数据未加载完成，请稍后再试');
      return;
    }

    // 检查必要的数据是否存在
    if (window.data.latitude === undefined || window.data.longitude === undefined ||
      window.data.latitude === null || window.data.longitude === null) {
      alert('当前IP地址没有有效的地理位置信息');
      return;
    }

    const modal = document.getElementById('mapModal');
    const mapFrame = document.getElementById('mapFrame');

    // 检查坐标是否有效，使用更宽松的检查
    const hasValidCoordinates = window.data.latitude !== undefined && window.data.latitude !== null && window.data.longitude !== undefined && window.data.longitude !== null;

    if (hasValidCoordinates && !isCreatingMap) {
      const lat = parseFloat(window.data.latitude);
      const lon = parseFloat(window.data.longitude);

      // 检查解析后的坐标是否有效
      if (isNaN(lat) || isNaN(lon)) {
        console.error('Invalid coordinates:', window.data.latitude, window.data.longitude);
        return;
      }

      // 设置创建标志
      isCreatingMap = true;

      // 立即显示模态框，提升用户体验
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';

      // 显示加载指示器
      mapFrame.innerHTML = '<div class="map-loading"><div class="loading-spinner"></div><p>地图加载中...</p></div>';

      // 动态加载 MapLibre GL JS（优化版）
      if (!window.maplibregl) {
        if (!mapLibraryLoading) {
          mapLibraryLoading = true;
          const script = document.createElement('script');
          script.src = 'https://s4.zstatic.net/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.min.js';
          script.async = true;
          script.onload = () => {
            mapLibraryLoaded = true;
            mapLibraryLoading = false;
            // 立即创建地图，不延迟
            requestAnimationFrame(() => {
              createMapLibreMap(lat, lon, mapFrame);
              isCreatingMap = false;
            });
          };
          script.onerror = () => {
            mapLibraryLoading = false;
            isCreatingMap = false;
            mapFrame.innerHTML = '<div class="map-error">地图加载失败，请重试</div>';
          };
          document.head.appendChild(script);
        }
      } else {
        // 立即创建地图
        requestAnimationFrame(() => {
          createMapLibreMap(lat, lon, mapFrame);
          isCreatingMap = false;
        });
      }
    } else {
      console.log('Map not shown due to invalid coordinates or isCreatingMap flag');
    }
  }

  // MapTiler Basic v2 地图样式配置
  const mapStyle = 'https://api.maptiler.com/maps/basic-v2/style.json?key=TffR4RG6Do9Ng4PyZ0Zf';

  // 缓存透明图像数据，避免重复创建
  let cachedTransparentImage = null;

  function getTransparentImage() {
    if (!cachedTransparentImage) {
      const size = 16;
      const data = new Uint8Array(size * size * 4);
      // 所有像素都设置为透明 (RGBA: 0,0,0,0)
      data.fill(0);

      cachedTransparentImage = {
        width: size,
        height: size,
        data: data
      };
    }
    return cachedTransparentImage;
  }

  // 创建 MapLibre 地图（性能优化版）
  function createMapLibreMap(lat, lon, container) {
    // 如果地图已存在，则更新地图而不是重新创建
    if (window.currentMap) {
      console.log('地图已存在，更新坐标');

      // 更新地图中心点
      window.currentMap.setCenter([lon, lat]);
      window.currentMap.setZoom(14);

      // 更新标记位置
      if (window.currentMarker) {
        window.currentMarker.setLngLat([lon, lat]);
      }

      // 更新弹窗内容和位置
      if (window.currentPopup) {
        // 更新弹窗内容
        const popupContent = document.createElement('div');
        popupContent.className = 'map-popup';
        popupContent.innerHTML = `
          <h4>📍 ${window.data.ip || 'N/A'}</h4>
          <p><strong>位置:</strong> ${window.data.city || 'N/A'}, ${window.data.country || 'N/A'}</p>
          <p><strong>坐标:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
          ${window.data.isp ? `<p><strong>ISP:</strong> ${window.data.isp}</p>` : ''}
        `;

        // 更新弹窗内容和位置
        window.currentPopup.setLngLat([lon, lat]);
        window.currentPopup.setDOMContent(popupContent);
      } else {
        // 如果没有弹窗则创建一个
        const popupContent = document.createElement('div');
        popupContent.className = 'map-popup';
        popupContent.innerHTML = `
          <h4>📍 ${window.data.ip || 'N/A'}</h4>
          <p><strong>位置:</strong> ${window.data.city || 'N/A'}, ${window.data.country || 'N/A'}</p>
          <p><strong>坐标:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
          ${window.data.isp ? `<p><strong>ISP:</strong> ${window.data.isp}</p>` : ''}
        `;

        window.currentPopup = new maplibregl.Popup({
          offset: [0, -45],
          closeButton: true,
          closeOnClick: false,
          anchor: 'bottom',
          maxWidth: '180px'
        })
          .setLngLat([lon, lat])
          .setDOMContent(popupContent)
          .addTo(window.currentMap);
      }

      return;
    }

    // 清理之前的标记和弹窗
    if (window.currentMarker) {
      try {
        window.currentMarker.remove();
      } catch (e) {
        console.log('清理标记时出错:', e);
      }
      window.currentMarker = null;
    }
    if (window.currentPopup) {
      try {
        window.currentPopup.remove();
      } catch (e) {
        console.log('清理弹窗时出错:', e);
      }
      window.currentPopup = null;
    }

    // 清空容器
    container.innerHTML = '';

    // 确保容器尺寸正确
    container.style.width = '100%';
    container.style.height = '100%';

    try {
      // 优化的地图配置
      const map = new maplibregl.Map({
        container: container,
        style: mapStyle,
        center: [lon, lat],
        zoom: 13,
        attributionControl: true,
        hash: false,
        maxZoom: 16,
        minZoom: 8,
        // 性能优化设置
        preserveDrawingBuffer: false,
        antialias: false,
        fadeDuration: 0,
        // 减少不必要的网络请求
        refreshExpiredTiles: false,
        // 优化瓦片缓存
        maxTileCacheSize: 100
      });

      // 添加导航控件
      map.addControl(new maplibregl.NavigationControl({
        showCompass: false, // 隐藏指南针以减少渲染负担
        showZoom: true
      }), 'top-left');

      // 添加全屏控件
      map.addControl(new maplibregl.FullscreenControl(), 'top-left');

      // 优化的缺失图像处理
      map.on('styleimagemissing', (e) => {
        try {
          map.addImage(e.id, getTransparentImage());
        } catch (imgError) {
          console.log('添加占位图像失败:', imgError);
        }
      });

      // 优化的中文标签处理
      let styleDataTimeout;
      map.on('styledata', () => {
        clearTimeout(styleDataTimeout);
        styleDataTimeout = setTimeout(() => {
          try {
            const style = map.getStyle();
            if (style && style.layers) {
              // 只处理主要的文本图层，提升性能
              const textLayers = style.layers.filter(layer =>
                layer.type === 'symbol' &&
                layer.layout &&
                layer.layout['text-field'] &&
                !layer.id.includes('poi-') // 跳过POI图层以提升性能
              );

              textLayers.forEach(layer => {
                try {
                  if (map.getLayer(layer.id)) {
                    map.setLayoutProperty(layer.id, 'text-field', [
                      'coalesce',
                      ['get', 'name:zh'],
                      ['get', 'name_zh'],
                      ['get', 'name:zh-Hans'],
                      ['get', 'name'],
                      ['get', 'name:en']
                    ]);
                  }
                } catch (layerError) {
                  // 静默处理错误，避免控制台噪音
                }
              });
            }
          } catch (e) {
            // 静默处理错误
          }
        }, 200); // 适当延迟以避免频繁操作
      });

      // 地图加载完成后的处理（高性能版）
      map.on('load', () => {
        console.log('MapLibre 地图加载完成');

        // 使用requestAnimationFrame优化DOM操作
        requestAnimationFrame(() => {
          // 立即设置视图
          try {
            map.resize();
            map.jumpTo({ center: [lon, lat], zoom: 14 }); // 使用jumpTo代替setCenter/setZoom
          } catch (resizeError) {
            console.log('调整地图大小时出错:', resizeError);
          }

          // 创建优化的标记元素
          const markerElement = document.createElement('div');
          markerElement.className = 'custom-marker';
          markerElement.innerHTML = `
            <div class="marker-pulse"></div>
            <div class="marker-pin">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
            </div>
          `;

          // 创建并添加标记
          window.currentMarker = new maplibregl.Marker(markerElement)
            .setLngLat([lon, lat])
            .addTo(map);

          // 创建紧凑的弹窗内容
          const popupContent = document.createElement('div');
          popupContent.className = 'map-popup';
          popupContent.innerHTML = `
            <h4>📍 ${window.data.ip || 'N/A'}</h4>
            <p><strong>位置:</strong> ${window.data.city || 'N/A'}, ${window.data.country || 'N/A'}</p>
            <p><strong>坐标:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
            ${window.data.isp ? `<p><strong>ISP:</strong> ${window.data.isp}</p>` : ''}
          `;

          // 添加弹窗
          window.currentPopup = new maplibregl.Popup({
            offset: [0, -45],
            closeButton: true,
            closeOnClick: false,
            anchor: 'bottom',
            maxWidth: '180px'
          })
            .setLngLat([lon, lat])
            .setDOMContent(popupContent)
            .addTo(map);
        });
      });

      // 智能错误处理
      map.on('error', (e) => {
        // 只记录严重错误，忽略瓦片加载的CORS错误
        if (e.error && e.error.message && !e.error.message.includes('CORS')) {
          console.error('地图严重错误:', e);
        } else if (e.tile) {
          // 瓦片加载错误，通常不影响整体显示
          console.log('瓦片加载警告（可忽略）:', e.tile.tileID);
        }
      });

      // 简化的数据加载监听
      map.on('data', (e) => {
        if (e.dataType === 'style') {
          console.log('地图样式加载完成');
        }
      });

      // 存储地图实例
      window.currentMap = map;

    } catch (error) {
      console.error('创建地图时出错:', error);
      isCreatingMap = false;
    }
  }





  // 关闭地图
  function closeMap() {
    const modal = document.getElementById('mapModal');
    modal.classList.remove('show');
    document.body.style.overflow = 'auto';

    // 重置创建标志
    isCreatingMap = false;

    // 延迟清理，确保动画完成
    setTimeout(() => {
      try {
        // 清理弹窗
        if (window.currentPopup) {
          window.currentPopup.remove();
          window.currentPopup = null;
        }

        // 清理标记
        if (window.currentMarker) {
          window.currentMarker.remove();
          window.currentMarker = null;
        }

        // 清理地图实例
        if (window.currentMap) {
          window.currentMap.remove();
          window.currentMap = null;
        }

        // 清空容器
        const mapFrame = document.getElementById('mapFrame');
        if (mapFrame) {
          mapFrame.innerHTML = '';
        }
      } catch (error) {
        console.error('清理地图资源时出错:', error);
      }
    }, 300);
  }

  // 优化窄屏幕显示
  function optimizeNarrowScreen() {
    const ipInput = document.getElementById('ipInput');
    if (ipInput) {
      // 根据屏幕宽度调整占位符文本
      function updatePlaceholder() {
        const screenWidth = window.innerWidth;
        if (screenWidth <= 280) {
          ipInput.placeholder = '输入IP';
        } else if (screenWidth <= 355) {
          ipInput.placeholder = '输入IP地址';
        } else {
          ipInput.placeholder = '输入 IP 地址查询其他位置';
        }
      }

      // 初始调用
      updatePlaceholder();

      // 监听窗口大小变化
      window.addEventListener('resize', updatePlaceholder);
    }
  }

  // 回车键查询
  document.addEventListener('DOMContentLoaded', function () {
    const ipInput = document.getElementById('ipInput');
    if (ipInput) {
      ipInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          navigate();
        }
      });
    }

    // ESC 键关闭地图
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeMap();
      }
    });
  });
</script>
