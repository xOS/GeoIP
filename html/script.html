<script lang="text/javascript">
  let host = "{{ .Host }}";
  let jsonObj = "{{ .JSON }}";
  let data;

  // 安全地解析 JSON
  try {
    data = JSON.parse(jsonObj);
  } catch (e) {
    console.error('JSON解析失败:', e);
    data = {}; // 设置为空对象作为默认值
  }

  let ip = '';
  let ipQuery = '';

  window.onload = (event) => {
    // 确保 window.data 被正确初始化
    window.data = data;

    // 初始化主题
    initTheme();
    // 格式化 JSON 显示
    formatJSON();
    // 检查并优化 IP 显示
    optimizeIPDisplay();
    // 高亮 API 代码
    highlightApiCode();
    // 隐藏空白字段
    hideEmptyFields();
    // 优化窄屏幕显示
    optimizeNarrowScreen();
  }

  // 隐藏空白字段
  function hideEmptyFields() {
    // 获取所有信息项
    const infoItems = document.querySelectorAll('.info-item');

    // 遍历所有信息项，检查值是否为空
    infoItems.forEach(item => {
      const labelElement = item.querySelector('.info-label');
      const valueElement = item.querySelector('.info-value');

      // 特殊处理设备 UA 字段
      if (item.style.flexDirection === 'column' || item.style.flexDirection === 'column-reverse') {
        // 对于设备 UA 字段，检查值是否为空
        if (!valueElement || !valueElement.textContent.trim()) {
          item.style.display = 'none';
        }
        return;
      }

      if (labelElement && valueElement) {
        const labelText = labelElement.textContent.trim();
        const valueText = valueElement.textContent.trim();

        // 如果值为空，则隐藏整个信息项
        if (!valueText) {
          item.style.display = 'none';
        }
      }
    });
  }

  // 主题管理
  function initTheme() {
    // 默认使用亮色主题
    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    setTheme(newTheme);
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    // 更新主题切换按钮的提示文本
    const themeBtn = document.querySelector('.theme-toggle-btn');
    if (themeBtn) {
      themeBtn.title = theme === 'light' ? '切换到暗色模式' : '切换到亮色模式';
    }
  }

  function optimizeIPDisplay() {
    const ipValueElement = document.querySelector('.ip-value');
    if (ipValueElement) {
      const ipText = ipValueElement.textContent;

      // 检测 IPv6 地址
      if (ipText.includes(':') && ipText.length > 15) {
        ipValueElement.classList.add('ipv6');
      }

      // 检测超长 IP 地址
      if (ipText.length > 20) {
        ipValueElement.style.fontSize = '1.2rem';
        ipValueElement.style.letterSpacing = '0.2px';
      }
    }
  }

  // 优化窄屏幕显示
  function optimizeNarrowScreen() {
    const ipInput = document.getElementById('ipInput');
    if (ipInput) {
      // 根据屏幕宽度调整占位符文本
      function updatePlaceholder() {
        const screenWidth = window.innerWidth;
        if (screenWidth <= 280) {
          ipInput.placeholder = '输入IP';
        } else if (screenWidth <= 355) {
          ipInput.placeholder = '输入IP地址';
        } else {
          ipInput.placeholder = '输入 IP 地址查询其它位置';
        }
      }

      // 初始调用
      updatePlaceholder();

      // 监听窗口大小变化
      window.addEventListener('resize', updatePlaceholder);
    }
  }

  function formatJSON() {
    const jsonOutput = document.getElementById('jsonOutput');
    if (jsonOutput) {
      try {
        const formatted = JSON.stringify(JSON.parse(jsonObj), null, 2);
        const highlighted = syntaxHighlight(formatted);
        jsonOutput.innerHTML = highlighted;
      } catch (e) {
        jsonOutput.textContent = jsonObj;
      }
    }
  }

  function syntaxHighlight(json) {
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
      var cls = 'json-number';
      if (/^"/.test(match)) {
        if (/:$/.test(match)) {
          cls = 'json-key';
        } else {
          cls = 'json-string';
        }
      } else if (/true|false/.test(match)) {
        cls = 'json-boolean';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }

  // 暂时禁用API代码高亮，直接在HTML中处理
  function highlightApiCode() {
    // 不做任何处理，保持原始HTML内容
  }

  function copyJSON() {
    // 获取原始 JSON 内容，不包含 HTML 标签
    const jsonContent = JSON.stringify(JSON.parse(jsonObj), null, 2);

    if (navigator.clipboard) {
      navigator.clipboard.writeText(jsonContent).then(() => {
        showCopySuccess();
      }).catch(() => {
        fallbackCopy(jsonContent);
      });
    } else {
      fallbackCopy(jsonContent);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
      document.execCommand('copy');
      showCopySuccess();
    } catch (err) {
      console.error('复制失败:', err);
    }

    document.body.removeChild(textArea);
  }

  function showCopySuccess() {
    const copyBtn = document.querySelector('.copy-btn');
    const originalHTML = copyBtn.innerHTML;

    // 创建成功提示图标（颜色与复制图标一致）
    const successIcon = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20,6 9,17 4,12"/>
      </svg>
    `;

    copyBtn.innerHTML = successIcon;
    copyBtn.title = '已复制!';

    setTimeout(() => {
      copyBtn.innerHTML = originalHTML;
      copyBtn.title = '复制 JSON';
    }, 2000);
  }

  function navigate() {
    const ipInput = document.getElementById('ipInput');
    const inputValue = ipInput.value.trim();

    if (inputValue) {
      // 简单的 IP 地址验证
      const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
      const ipv6Regex = /^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/;

      if (ipRegex.test(inputValue) || ipv6Regex.test(inputValue)) {
        // 使用 AJAX 请求获取数据，而不是跳转页面
        fetch(`/json?ip=${encodeURIComponent(inputValue)}`)
          .then(response => response.json())
          .then(data => {
            // 更新页面内容
            updatePageContent(data);
          })
          .catch(error => {
            console.error('Error fetching data:', error);
            alert('查询失败，请稍后重试');
          });
      } else {
        alert('请输入有效的 IP 地址');
        ipInput.focus();
      }
    } else {
      alert('请输入 IP 地址');
      ipInput.focus();
    }
  }

  function updateIP(value) {
    ip = value.trim();
  }

  function updatePageContent(data) {
    // 更新数据（首先更新，确保在函数执行过程中使用最新的数据）
    window.data = data;

    // 同时更新全局 jsonObj 变量
    jsonObj = JSON.stringify(data);

    // 更新页面标题中的IP显示
    const ipValueElements = document.querySelectorAll('.ip-value');
    ipValueElements.forEach(element => {
      element.textContent = data.ip || 'N/A';
      // 优化IP显示
      if (data.ip && data.ip.includes(':') && data.ip.length > 15) {
        element.classList.add('ipv6');
      } else {
        element.classList.remove('ipv6');
      }

      // 检测超长 IP 地址
      if (data.ip && data.ip.length > 20) {
        element.style.fontSize = '1.2rem';
        element.style.letterSpacing = '0.2px';
      } else {
        element.style.fontSize = '';
        element.style.letterSpacing = '';
      }
    });

    // 通过标签文本来更新左侧信息框中的各项信息
    // 只有在元素存在时才更新，避免因为元素不存在而出现问题
    safeUpdateInfoItemByLabel('IP 地址', data.ip);
    safeUpdateInfoItemByLabel('地区', data.country);
    safeUpdateInfoItemByLabel('地区代码', data.country_code);
    safeUpdateInfoItemByLabel('省/州', data.region);
    safeUpdateInfoItemByLabel('城市', data.city);
    safeUpdateInfoItemByLabel('区县', data.district);
    safeUpdateInfoItemByLabel('邮编', data.zip_code);
    // 安全地更新经纬度信息
    if (data.latitude !== undefined && data.longitude !== undefined) {
      safeUpdateInfoItemByLabel('经纬度', Number(data.latitude).toFixed(3) + ',' + Number(data.longitude).toFixed(3));
    } else {
      safeUpdateInfoItemByLabel('经纬度', '');
    }
    safeUpdateInfoItemByLabel('ASN', data.asn);
    safeUpdateInfoItemByLabel('服务商', data.isp);
    safeUpdateInfoItemByLabel('组织', data.org);
    safeUpdateInfoItemByLabel('类型', data.connection_type);
    safeUpdateInfoItemByLabel('网段', data.network);
    safeUpdateInfoItemByLabel('主机名', data.hostname);

    // 设备 UA (特殊处理)
    const userAgentItems = document.querySelectorAll('.info-item[style*="flex-direction:column"]');
    if (userAgentItems.length > 0) {
      const userAgentElement = userAgentItems[0].querySelector('.info-value');
      if (userAgentElement) {
        const parent = userAgentItems[0];
        if (data.user_agent) {
          userAgentElement.textContent = data.user_agent;
          userAgentElement.style.whiteSpace = 'pre-line';
          userAgentElement.style.wordBreak = 'break-all';
          userAgentElement.style.marginTop = '2px';
          parent.style.display = '';
        } else {
          parent.style.display = 'none';
        }
      }
    }

    // 更新JSON预览框
    const jsonOutput = document.getElementById('jsonOutput');
    if (jsonOutput) {
      try {
        const formatted = JSON.stringify(data, null, 2);
        const highlighted = syntaxHighlight(formatted);
        jsonOutput.innerHTML = highlighted;
        // 更新全局变量
        jsonObj = JSON.stringify(data);
      } catch (e) {
        jsonOutput.textContent = JSON.stringify(data);
      }
    }
  }

  function safeUpdateInfoItemByLabel(label, value) {
    // 查找对应标签的元素
    const labelElements = Array.from(document.querySelectorAll('.info-label'));
    const labelElement = labelElements.find(el => el.textContent.trim() === label);

    if (labelElement) {
      // 找到对应的值元素（在标签元素的父元素中的另一个子元素）
      const parent = labelElement.closest('.info-item');
      if (parent) {
        const valueElement = parent.querySelector('.info-value');
        if (valueElement) {
          // 如果有值则显示，否则隐藏整个信息项
          if (value !== undefined && value !== null && value !== "") {
            valueElement.textContent = value;
            parent.style.display = '';
          } else {
            parent.style.display = 'none';
          }
        }
      }
    }
    // 如果没有找到对应的标签元素，则不执行任何操作
  }

  // 回车键查询
  document.addEventListener('DOMContentLoaded', function () {
    const ipInput = document.getElementById('ipInput');
    if (ipInput) {
      ipInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          navigate();
        }
      });
    }
  });
</script>
