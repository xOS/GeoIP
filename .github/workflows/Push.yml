name: Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v2
      - name: install go
        uses: actions/setup-go@v2
        with:
          go-version: 1.16
      - name: build and test
        run: make
      - name: enable experimental docker features
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          echo '{"experimental":true}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
      - name: publish multi-arch docker image
        if: ${{ github.ref == 'refs/heads/master' }}
        run: make docker-pushx  
      - name: Log in to the GHCR
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build geoip image
        run: |
          go env
          docker build -t geoip -f Dockerfile .
      - name: Push geoip image
        run: |
          GHRC_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/geoip" | tr '[:upper:]' '[:lower:]')
          docker tag geoip $GHRC_IMAGE_NAME
          docker push $GHRC_IMAGE_NAME
          docker tag geoip nangle/geoip
          docker push nangle/geoip
