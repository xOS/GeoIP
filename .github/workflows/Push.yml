name: Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - uses: actions/checkout@v2
    - name: install go
      uses: actions/setup-go@v2
      with:
        go-version: 1.16
    - name: build and test
      run: make
    - name: enable experimental docker features
      if: ${{ github.ref == 'refs/heads/master' }}
      run: |
        echo '{"experimental":true}' | sudo tee /etc/docker/daemon.json
        sudo service docker restart
    - name: publish multi-arch docker image
      if: ${{ github.ref == 'refs/heads/master' }}
      run: make docker-pushx  
    - name: Log into registry
      run: |
        echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    - name: Build dasbboard image
      run: |
        go env
        docker build -t geoip -f Dockerfile .
    - name: Push dasbboard image
      run: |
        GHRC_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/geoip" | tr '[:upper:]' '[:lower:]')
        docker tag geoip $GHRC_IMAGE_NAME
        docker push $GHRC_IMAGE_NAME
        docker tag geoip nangle/geoip
        docker push nangle/geoip
